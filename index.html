<html lang="ru"><head><meta charset="utf-8">

<title>Словарь терминов · Основы философии</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Playfair+Display:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#a3182b;--wine2:#7d1020;--ink:#8f1226;--cream:#efe9e4;--paper:#fff;--text:#3a2a2c;--soft:#7a6a6c;--line:#e2d6d0;--onwine:#f3ebe6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.6 Montserrat,system-ui,sans-serif}
.script{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600}
.serif{font-family:"Playfair Display",Georgia,serif;letter-spacing:-.02em}
.tag{font:500 11px/1.4 Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.hero{background:radial-gradient(120% 90% at 70% 0,var(--wine) 0,var(--wine2) 70%);color:var(--onwine);padding:28px 22px 0;overflow:hidden;position:relative}
.hero .tag{max-width:230px;opacity:.9}
.hero h1{margin:0;padding:0 0 30px;font-size:clamp(88px,25vw,230px);line-height:1.1;font-weight:600;color:#fff!important;position:relative;z-index:2;white-space:nowrap}
.hero .loc{position:absolute;right:22px;top:30px;text-align:right}
.pola{position:absolute;background:#fff;padding:8px 8px 26px;box-shadow:0 10px 28px #0006;color:var(--wine2);width:clamp(78px,20vw,130px);aspect-ratio:.82}
.pola i{display:grid;place-items:center;height:100%;background:linear-gradient(150deg,#d9c7c2,#b9858a);font:italic 600 clamp(44px,12vw,84px)/1 "Cormorant Garamond",serif;color:#fff}
.stage{position:relative;height:170px}.p1{right:2%;top:30px;transform:rotate(7deg)}.p2{right:36%;top:46px;transform:rotate(-6deg)}
.intro{background:var(--cream);padding:56px 22px;display:grid;gap:28px;max-width:100%}
.intro h2{font-size:clamp(34px,8vw,64px);line-height:1;margin:0;color:var(--ink);font-weight:500}
.intro h2 em{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.15em}
.intro p{max-width:620px;margin:0;font-size:14px}
.btn{display:inline-block;background:var(--wine);color:#fff;border:0;border-radius:6px;padding:10px 22px;font:500 12px Montserrat;letter-spacing:.06em;cursor:pointer;text-decoration:none}
.tool{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 22px}
.sbox{display:flex;gap:10px;align-items:center;border:1px solid var(--wine);border-radius:8px;padding:0 14px;background:var(--paper)}
.sbox input{flex:1;border:0;outline:0;background:none;color:var(--text);font:500 16px Montserrat;padding:13px 0;min-width:0}
.sbox button{border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--wine);color:var(--ink);background:none;border-radius:99px;padding:6px 14px;font:500 12px Montserrat;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--wine);color:#fff}
.abc{display:flex;gap:2px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.abc a{flex:none;color:var(--ink);text-decoration:none;font:italic 600 20px "Cormorant Garamond",serif;padding:0 7px}
.count{font-size:12px;color:var(--soft);padding:16px 22px 0}
.sec{padding:44px 22px}.sec.w{background:var(--paper)}.sec.c{background:var(--cream)}
.sec.r{background:linear-gradient(var(--wine),var(--wine2));color:var(--onwine)}
.letter{font:italic 600 clamp(80px,22vw,170px)/.8 "Cormorant Garamond",serif;margin:0 0 20px;color:var(--ink)}
.r .letter{color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:20px 20px 18px}
.r .card{background:#fff;color:#3a2a2c;border:0;box-shadow:0 8px 22px #0004}
.c .card{background:var(--paper)}
.card h3{margin:0 0 8px;font:500 24px/1.1 "Playfair Display",serif;letter-spacing:-.02em;color:#8f1226}
:root[data-theme="dark"] .card h3,:root:not([data-theme="light"]) .card h3{color:var(--ink)}
.r .card h3{color:#8f1226!important}
.card p{margin:0;font-size:14px}
.card .q{margin-top:12px;padding-left:12px;border-left:2px solid var(--wine);font:italic 500 16px/1.4 "Cormorant Garamond",serif}
.card small{display:block;margin-top:10px;font:500 10px Montserrat;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
mark{background:#f6c9cf;color:#7d1020;border-radius:2px;padding:0 1px}
.empty{text-align:center;padding:80px 22px;font:italic 600 34px "Cormorant Garamond",serif;color:var(--ink)}
.fc{position:fixed;inset:0;z-index:100;background:linear-gradient(var(--wine),var(--wine2));color:#f3ebe6;display:flex;flex-direction:column;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px))}.fc[hidden]{display:none}.fctop{display:flex;gap:10px;align-items:center}.fcb,.fc select{background:none;border:1px solid #f3ebe666;color:#fff;border-radius:99px;padding:7px 14px;font:500 12px Montserrat,sans-serif;cursor:pointer}.fc select{flex:1;min-width:0}.fc select option{color:#222}#fcx{font-size:20px;line-height:1;padding:4px 12px}.fcn{text-align:center;font:500 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.85}.fscene{flex:1;perspective:1200px;min-height:0}.finner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.finner.f{transform:rotateY(180deg)}.fface{position:absolute;inset:0;background:#fff;color:#3a2a2c;border-radius:6px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 36px #0005;overflow:auto}.fback{transform:rotateY(180deg)}.fface h3{margin:0;font:500 clamp(30px,9vw,48px)/1.1 'Playfair Display',serif;color:#8f1226;letter-spacing:-.02em}.fface p{margin:0;font-size:clamp(15px,4.2vw,19px);line-height:1.5}.fface small{margin-top:18px;font:500 10px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7a6a6c}.qq{display:block;margin-top:16px;font:italic 500 17px/1.4 'Cormorant Garamond',serif;color:#5a4a4c}.fbtns{display:flex;gap:12px}.btn2{flex:1;border:1px solid #f3ebe6aa;background:none;color:#fff;border-radius:8px;padding:14px;font:500 13px Montserrat,sans-serif;cursor:pointer}.btn2.ok{background:#fff;color:#8f1226;border-color:#fff}
footer{background:var(--wine2);color:var(--onwine);padding:48px 22px;text-align:center}
footer b{display:block;font:italic 600 clamp(36px,10vw,72px)/1 "Cormorant Garamond",serif;color:var(--cream);margin-bottom:8px}
</style></head><body>
<header class="hero">
 <div class="tag">Все термины учебника<br>«Основы философии»</div>
 <div class="tag loc">для СПО</div>
 <div class="stage"><div class="pola p1"><i>Ф</i></div><div class="pola p2"><i>Б</i></div></div>

</header>
<section class="intro">
 <div class="tag" style="color:var(--ink)">Ничего лишнего - только понятия</div>
 <h2 class="serif">Где философия<br>встречает <em>понимание</em></h2>
 <p id="lead"></p>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="#tool">ИСКАТЬ ТЕРМИН</a><button class="btn" id="fopen" style="background:none;color:var(--ink);border:1px solid var(--wine)">КАРТОЧКИ ДЛЯ ЗАПОМИНАНИЯ</button></div>
</section>
<div class="tool" id="tool">
 <div class="sbox"><span>⌕</span><input id="q" type="search" placeholder="Найти термин: бытие, онтология, эмпиризм…" autocomplete="off"><button id="x" aria-label="Очистить">×</button></div>
 <div class="chips" id="chips"></div><div class="abc" id="abc"></div>
</div>
<div class="count" id="count"></div>
<main id="list"></main>
<div class="fc" id="fc" hidden><div class="fctop"><button class="fcb" id="fcx" aria-label="Закрыть">×</button><select id="fsel"></select><button class="fcb" id="fmode">Термин → смысл</button></div><div class="fcn" id="fcn"></div><div class="fscene" id="fscene"><div class="finner" id="finner"><div class="fface" id="ffront"></div><div class="fface fback" id="fback"></div></div></div><div class="fbtns"><button class="btn2" id="fagain">Ещё раз</button><button class="btn2 ok" id="fknow">Знаю</button></div></div>
<footer><b>Философия - это любовь к мудрости</b><div class="tag">Словарь составлен по учебнику «Основы философии», под ред. О. Ю. Рыбакова, МГЮА</div></footer>
<script>
const G=["Все","Предмет и структура","Античность","Средневековье и Возрождение","Новое время","Немецкая классика и марксизм","Русская философия","Современная философия","Бытие","Мышление и познание","Общество","Человек","Право"];
const DATA=[{"t": "Философия", "g": 1, "d": "Особый, предельно общий уровень рационального мышления о мире и человеке; учение о наиболее общих основаниях бытия, познания и ценностей.", "q": "Философия - это попытка объяснить мир и человека с позиций разума и в понятийной форме, таким образом, философия решает обычные мировоззренческие проблемы.", "p": 39}, {"t": "Мировоззрение", "g": 1, "d": "Система взглядов на мир и место человека в нём, определяющая отношение к жизни и ориентиры поведения.", "q": "«Мировоззрение - это совокупность взглядов, оценок, представлений человека о мире, многообразии явлений этого мира, их месте, взаимодействии, о месте самого человека, его предназначении, нормах поведения, отношениях с другими людьми и с обществом в целом».", "p": 14}, {"t": "Миф", "g": 1, "d": "Исторически первый тип мировоззрения: образно-эмоциональное объяснение мира через рассказы о богах, героях и первопредках.", "q": "Миф - это образец для подражания, этим способом утверждалась определенная система ценностей и поддерживались приемлемые нормы поведения.", "p": 37}, {"t": "Мифология", "g": 1, "d": "Совокупность мифов народа; целостная образная картина происхождения и устройства мира."}, {"t": "Религия", "g": 1, "d": "Тип мировоззрения, основанный на вере в сверхъестественное и в Бога, с культом, догматами и нормами жизни.", "q": "Религия - это прежде всего общение с трансцендентным, имеющим личный (чаще) или безличный характер.", "p": 180}, {"t": "Предмет философии", "g": 1, "d": "Круг проблем философии: наиболее общие законы бытия, познания, природы человека и общества.", "q": "Предмет философии - это общее в системе «мир - человек», то есть мир, человек и взаимоотношения между ними.", "p": 40}, {"t": "Онтология", "g": 1, "d": "Раздел философии - учение о бытии, его формах, структуре и основных категориях.", "q": "Онтология - это новая область философии, унаследовавшая тематику и проблематику метафизики.", "p": 137}, {"t": "Гносеология", "g": 1, "d": "Раздел философии - теория познания: возможности, источники, формы и критерии истинности знания."}, {"t": "Метафизика", "g": 1, "d": "Учение о первоосновах и предельных началах сущего, лежащих за пределами опытного знания."}, {"t": "Этика", "g": 1, "d": "Философская наука о морали и нравственности, о добре, зле, долге и смысле поступков."}, {"t": "Логика", "g": 1, "d": "Наука о формах и законах правильного мышления и о способах доказательства."}, {"t": "Эстетика", "g": 1, "d": "Учение о прекрасном, об искусстве и о чувственном восприятии красоты."}, {"t": "Аксиология", "g": 1, "d": "Философское учение о ценностях, их природе, иерархии и роли в жизни человека."}, {"t": "Философская антропология", "g": 1, "d": "Раздел философии, изучающий сущность, природу и предназначение человека."}, {"t": "Социальная философия", "g": 1, "d": "Раздел философии об обществе, его устройстве, законах развития и отношении человека к обществу."}, {"t": "Философия истории", "g": 1, "d": "Учение о смысле, движущих силах и закономерностях исторического процесса."}, {"t": "Философия права", "g": 1, "d": "Раздел философии, изучающий сущность, ценность и смысл права, его место в жизни человека и общества."}, {"t": "Картина мира", "g": 1, "d": "Целостный образ мира, складывающийся в сознании людей на основе знаний и мировоззрения эпохи."}, {"t": "Научная картина мира", "g": 1, "d": "Система представлений о природе и обществе, опирающаяся на достижения науки своего времени."}, {"t": "Натурфилософская картина мира", "g": 1, "d": "Умозрительная картина природы античности и средневековья, построенная на размышлении, а не на эксперименте."}, {"t": "Классическая (механическая) картина мира", "g": 1, "d": "Картина мира Нового времени: мир - механизм, подчинённый строгим причинным законам (Ньютон)."}, {"t": "Квантово-релятивистская картина мира", "g": 1, "d": "Картина мира XX в. на основе теории относительности и квантовой механики; отказ от абсолютных пространства и времени."}, {"t": "Постнеклассическая картина мира", "g": 1, "d": "Современная картина мира, учитывающая самоорганизацию, нелинейность, вероятность и включённость наблюдателя."}, {"t": "Функции философии", "g": 1, "d": "Основные роли философии: мировоззренческая, методологическая, гносеологическая, критическая, аксиологическая, прогностическая, воспитательная."}, {"t": "Мировоззренческая функция", "g": 1, "d": "Формирование целостного взгляда на мир и место в нём человека."}, {"t": "Методологическая функция", "g": 1, "d": "Выработка общих принципов и методов познания и деятельности."}, {"t": "Гносеологическая функция", "g": 1, "d": "Познавательная функция: исследование путей и способов получения достоверного знания."}, {"t": "Критическая функция", "g": 1, "d": "Сомнение в устоявшихся истинах и проверка их на обоснованность."}, {"t": "Аксиологическая функция", "g": 1, "d": "Оценка явлений с точки зрения ценностей; выработка ценностных ориентиров."}, {"t": "Прогностическая функция", "g": 1, "d": "Построение обоснованных моделей будущего на основе анализа современных тенденций."}, {"t": "Эвристика", "g": 1, "d": "Совокупность приёмов поиска новых знаний и решений; творческая основа открытий."}, {"t": "Герменевтика", "g": 1, "d": "Искусство и теория толкования и понимания текстов, смыслов и человеческих действий."}, {"t": "Диалектика", "g": 2, "d": "Учение о всеобщей связи и развитии через противоречия; у древних - искусство вести спор и искать истину в диалоге."}, {"t": "Архэ", "g": 2, "d": "Первоначало, из которого всё возникает и к которому возвращается; поиск архэ - ядро ранней греческой философии."}, {"t": "Фисис", "g": 2, "d": "Природа как самопроизвольно растущее, рождающееся начало всего сущего (у ранних греков)."}, {"t": "Космос", "g": 2, "d": "Упорядоченный, гармоничный мир в противоположность хаосу."}, {"t": "Хаос", "g": 2, "d": "Беспорядочное первобытное состояние мира до его упорядочения."}, {"t": "Апейрон", "g": 2, "d": "У Анаксимандра - неопределённое и беспредельное первоначало всего."}, {"t": "Логос", "g": 2, "d": "У Гераклита - закономерность и смысл мирового порядка; в более позднем смысле - слово, разум."}, {"t": "Атом", "g": 2, "d": "Неделимая частица, из которой, по Левкиппу и Демокриту, состоят все вещи."}, {"t": "Атомизм", "g": 2, "d": "Учение о том, что мир состоит из атомов и пустоты (Левкипп, Демокрит)."}, {"t": "Элейская школа", "g": 2, "d": "Школа Парменида и Зенона, впервые поставившая проблему бытия как вечного и неизменного."}, {"t": "Софисты", "g": 2, "d": "Платные учителя мудрости и красноречия V в. до н. э.; утверждали относительность истины («человек - мера всех вещей»)."}, {"t": "Майевтика", "g": 2, "d": "Метод Сократа: с помощью вопросов помочь собеседнику самому «родить» истину."}, {"t": "Ирония", "g": 2, "d": "Приём Сократа: притворное незнание, выводящее собеседника к осознанию собственных заблуждений."}, {"t": "Эйдос", "g": 2, "d": "Идея, умопостигаемая форма вещи; у Платона - подлинная сущность, существующая в мире идей."}, {"t": "Мир идей", "g": 2, "d": "У Платона - истинное вечное бытие; мир вещей - лишь несовершенные копии идей."}, {"t": "Материя и форма", "g": 2, "d": "У Аристотеля - два начала вещи: материя как возможность и форма как действительность."}, {"t": "Субстанция", "g": 2, "d": "Устойчивая основа вещей, то, что существует само по себе и является причиной самого себя."}, {"t": "Потенциальное и актуальное", "g": 2, "d": "У Аристотеля: возможное бытие (потенция) и осуществлённое (энергия, акт)."}, {"t": "Четыре причины", "g": 2, "d": "По Аристотелю: материальная, формальная, действующая и целевая причины бытия вещи."}, {"t": "Категории", "g": 2, "d": "Предельно общие понятия, отражающие основные формы бытия и мышления."}, {"t": "Стоицизм", "g": 2, "d": "Эллинистическая школа: добродетель - жить согласно природе и судьбе, сохраняя невозмутимость духа."}, {"t": "Эпикуреизм", "g": 2, "d": "Учение Эпикура: цель жизни - безмятежность и свобода от страха; удовольствие понимается как отсутствие страданий."}, {"t": "Скептицизм", "g": 2, "d": "Позиция сомнения в возможности достоверного знания."}, {"t": "Апологетика", "g": 3, "d": "Раннехристианская защита веры от нападок язычников и философов."}, {"t": "Патристика", "g": 3, "d": "Философия «отцов церкви» II-VIII вв., обосновавшая христианские догматы (Августин)."}, {"t": "Схоластика", "g": 3, "d": "Средневековая философия, соединявшая веру и разум; строго логические методы обоснования догматов (Фома Аквинский)."}, {"t": "Креационизм", "g": 3, "d": "Учение о сотворении мира Богом из ничего (Августин)."}, {"t": "Провидение", "g": 3, "d": "Божественный замысел, направляющий ход мира и истории."}, {"t": "Теоцентризм", "g": 3, "d": "Взгляд, ставящий в центр мира Бога как источник бытия и смысла."}, {"t": "Откровение", "g": 3, "d": "Истина, сообщённая человеку Богом непосредственно, а не добытая разумом."}, {"t": "Универсалии", "g": 3, "d": "Общие понятия (род, вид); в споре реалистов и номиналистов - существуют ли они реально."}, {"t": "Реализм", "g": 3, "d": "В средневековом споре об универсалиях: общие понятия существуют реально и до вещей."}, {"t": "Номинализм", "g": 3, "d": "Общие понятия - лишь имена; реальны только единичные вещи."}, {"t": "Теодицея", "g": 3, "d": "Богословско-философское оправдание Бога перед лицом существования зла."}, {"t": "Гуманизм", "g": 3, "d": "Мировоззрение, признающее ценность человека, его свободу и право на счастье."}, {"t": "Антропоцентризм", "g": 3, "d": "Взгляд, ставящий человека в центр мироздания; характерен для эпохи Возрождения."}, {"t": "Ренессанс", "g": 3, "d": "Эпоха Возрождения (XIV-XVI вв.): обращение к античности, гуманизм, культ творческой личности."}, {"t": "Пантеизм", "g": 3, "d": "Учение о тождестве Бога и природы: Бог растворён в мире (Бруно, Спиноза)."}, {"t": "Утопия", "g": 3, "d": "Образ идеального общества, не существующего в действительности (Т. Мор, Т. Кампанелла)."}, {"t": "Эмпиризм", "g": 4, "d": "Направление, считающее источником знания опыт и чувственное восприятие (Ф. Бэкон)."}, {"t": "Рационализм", "g": 4, "d": "Направление, признающее разум основным источником достоверного знания (Декарт).", "q": "Рационализм - направление, считающее разум основным источником познания.", "p": 44}, {"t": "Сенсуализм", "g": 4, "d": "Учение, согласно которому всё знание происходит из ощущений (Локк).", "q": "Сенсуализм - направление в теории познания, рассматривающее ощущение и восприятие как единственные источники познания.", "p": 76}, {"t": "Индукция", "g": 4, "d": "Способ рассуждения и метод познания: переход от частных фактов к общим выводам."}, {"t": "Дедукция", "g": 4, "d": "Вывод частного из общего положения; метод Декарта."}, {"t": "Идолы (призраки)", "g": 4, "d": "По Ф. Бэкону - ложные представления, мешающие познанию: идолы рода, пещеры, площади, театра."}, {"t": "Дуализм", "g": 4, "d": "Учение о двух равноправных началах - материальном и духовном (Декарт)."}, {"t": "Монизм", "g": 4, "d": "Учение о единой основе всего сущего.", "q": "Монизм - это философское направление, признающее одну субстанцию, таковы материализм и идеализм.", "p": 43}, {"t": "Плюрализм", "g": 4, "d": "Учение о множественности самостоятельных начал бытия."}, {"t": "Монада", "g": 4, "d": "У Лейбница - простая духовная субстанция, «атом духа», основа мира."}, {"t": "Предустановленная гармония", "g": 4, "d": "У Лейбница - согласованность монад, заранее установленная Богом."}, {"t": "Общественный договор", "g": 4, "d": "Идея (Гоббс, Локк, Руссо): государство возникает по соглашению людей ради безопасности и прав."}, {"t": "Естественное состояние", "g": 4, "d": "Гипотетическое состояние людей до образования государства."}, {"t": "Естественное право", "g": 4, "d": "Права, принадлежащие человеку от природы и не зависящие от воли государства.", "q": "Естественное право - совокупность принципов и прав, метафизически обусловленных природой человека.", "p": 19}, {"t": "Просвещение", "g": 4, "d": "Эпоха XVIII в., провозгласившая власть разума, свободу и критику предрассудков.", "q": "Просвещение - это «оптимистическая философия прогрессивно крепнущей буржуазии, философия, целиком посвятившая себя прогрессу.", "p": 78}, {"t": "Деизм", "g": 4, "d": "Взгляд, по которому Бог создал мир, но не вмешивается в его ход.", "q": "Деизм - философское учение, в котором Бог является творцом мира, но после сотворения Бог больше не вмешивается в дела этого мира.", "p": 78}, {"t": "Материализм", "g": 4, "d": "Направление, признающее первичной материю, а сознание - её свойством.", "q": "Материализм - это философское направление, считающее материю первичной, а сознание - производным от нее.", "p": 43}, {"t": "Идеализм", "g": 4, "d": "Направление, признающее первичным дух, идею, сознание."}, {"t": "Объективный идеализм", "g": 4, "d": "Идеализм, видящий первооснову мира в надындивидуальной идее или духе (Платон, Гегель)."}, {"t": "Субъективный идеализм", "g": 4, "d": "Идеализм, сводящий мир к ощущениям и сознанию субъекта."}, {"t": "Вещь в себе", "g": 5, "d": "У Канта - реальность, как она есть сама по себе, недоступная познанию; познаются лишь «вещи для нас»."}, {"t": "Апостериорное знание", "g": 5, "d": "Знание, получаемое из опыта и после него; в отличие от априорного, зависит от чувственных данных (по Канту)."}, {t:'Трансцендентальная апперцепция',g:5,d:'У Канта - изначальное самосознание «Я мыслю», которое сопровождает все наши представления и сводит многообразие опыта в единство; условие возможности любого познания.'},{t:'Апперцепция',g:5,d:'Осознание человеком своих восприятий и представлений как принадлежащих его «Я»; у Канта различают эмпирическую и трансцендентальную апперцепцию.'},{t:'Эмпирическое «Я»',g:5,d:'Я как предмет самонаблюдения: переменные состояния, чувства и мысли человека во времени, в отличие от трансцендентального «Я».'},{t:'Трансцендентальный субъект',g:5,d:'Общее для всех людей познающее «Я» как носитель априорных форм (созерцания, категорий), делающих опыт возможным; не отдельная личность.'},{t:'Трансцендентальный идеализм',g:5,d:'Позиция Канта: мы познаём не вещи сами по себе, а явления, упорядоченные априорными формами нашего сознания.'},{t:'Трансцендентальный метод',g:5,d:'Метод Канта: исследовать не предметы, а условия возможности самого познания предметов в сознании человека.'},{t:'Трансцендентальная эстетика',g:5,d:'Часть «Критики чистого разума» об априорных формах чувственного созерцания - пространстве и времени.'},{t:'Трансцендентальная аналитика',g:5,d:'Часть «Критики чистого разума» об априорных понятиях рассудка (категориях) и их применении к опыту.'},{t:'Трансцендентальная диалектика',g:5,d:'Часть «Критики чистого разума», показывающая, что разум, выходя за пределы опыта, впадает в иллюзии и антиномии.'},{t:'Трансцендентальная иллюзия',g:5,d:'Неизбежная видимость, будто разум может познать то, что лежит за пределами опыта: Бога, душу, мир как целое.'},{t:'Трансцендентальное и трансцендентное',g:5,d:'Трансцендентальное - то, что относится к условиям возможности опыта (у Канта); трансцендентное - то, что лежит за пределами всякого возможного опыта.'},{t:'Трансцендентный',g:1,d:'Находящийся за пределами опыта и познания, потусторонний; религия, в отличие от философии, имеет дело с трансцендентной реальностью.'},{t:'Трансцендентный мир',g:1,d:'Потусторонний мир, лежащий за границами чувственного опыта: мир Бога, вещей в себе, высших сущностей.'},{t:'Имманентный',g:1,d:'Внутренне присущий предмету или миру, остающийся в пределах опыта; противоположность трансцендентному.'},{t:'Трансцендентализм',g:7,d:'Философский подход, ищущий условия возможности опыта, знания и бытия за их видимыми проявлениями (от Канта до современных учений).'},{t:'Феномен',g:5,d:'Явление: то, как предмет дан нам в опыте; у Канта познаваем только мир феноменов.'},{t:'Ноумен',g:5,d:'Умопостигаемая сущность, «вещь в себе», мыслимая разумом, но недоступная чувственному опыту и теоретическому познанию.'},{t:'Мир явлений и мир вещей в себе',g:5,d:'Два мира Канта: феноменальный (доступный познанию) и ноуменальный (трансцендентный, не познаваемый, но мыслимый).'},{t:'Чистый разум',g:5,d:'Способность познания, независимая от опыта; предмет «Критики чистого разума» Канта.'},{t:'Критика чистого разума',g:5,d:'Главный труд Канта (1781): исследование возможностей и границ познания разумом независимо от опыта.'},{t:'Формы чувственного созерцания',g:5,d:'Пространство и время как априорные формы, в которых человек воспринимает все предметы опыта (по Канту).'},{t:'Категории рассудка',g:5,d:'Априорные понятия (причинность, единство, необходимость и др.), посредством которых рассудок упорядочивает данные опыта.'},{t:'Постулаты практического разума',g:5,d:'Свобода, бессмертие души и бытие Бога: недоказуемые теоретически, но необходимые для нравственности (Кант).'},{t:'Феноменология',g:7,d:'Направление XX в. (Гуссерль), изучающее явления сознания и способы, которыми предметы даны в опыте.'},{"t": "Априорное знание", "g": 5, "d": "Знание, независимое от опыта и предшествующее ему (по Канту)."}, {"t": "Аналитические суждения", "g": 5, "d": "Суждения, в которых сказуемое уже содержится в понятии подлежащего; не расширяют знания.", "q": "Аналитические суждения - это поясняющие суждения: то, что утверждается о некотором объекте, уже содержится в понятии об этом объекте.", "p": 85}, {"t": "Синтетические суждения", "g": 5, "d": "Суждения, добавляющие к понятию новое содержание; расширяют знание.", "q": "Синтетические суждения - это расширяющие суждения, то есть они добавляют то, чего не содержалось в понятии об объекте.", "p": 85}, {"t": "Антиномия", "g": 5, "d": "Противоречие между двумя одинаково доказуемыми утверждениями разума (Кант)."}, {"t": "Категорический императив", "g": 5, "d": "Нравственный закон Канта: поступай так, чтобы твоя максима могла стать всеобщим законом."}, {"t": "Трансцендентальный", "g": 5, "d": "У Канта - относящийся к условиям возможности опыта, предшествующим ему."}, {"t": "Абсолютная идея", "g": 5, "d": "У Гегеля - высшая ступень самопознания духа, итог его развития."}, {"t": "Законы диалектики", "g": 5, "d": "Единство и борьба противоположностей, переход количества в качество, отрицание отрицания."}, {"t": "Диалектический материализм", "g": 5, "d": "Философия марксизма: материя первична, развитие совершается по законам диалектики."}, {"t": "Исторический материализм", "g": 5, "d": "Марксистское учение об обществе, где основа истории - способ производства."}, {"t": "Базис и надстройка", "g": 5, "d": "В марксизме: экономические отношения (базис) и политико-правовые и идейные формы над ними."}, {"t": "Общественно-экономическая формация", "g": 5, "d": "Тип общества на определённой ступени развития способа производства."}, {"t": "Общественное бытие", "g": 5, "d": "Материальная жизнь общества - производство и социальные отношения.", "q": "Общественное бытие - это совокупность материальных общественных отношений и процессов, которые не зависят от сознания и воли человека или общества в целом.", "p": 90}, {"t": "Общественное сознание", "g": 5, "d": "Совокупность идей, теорий и взглядов общества, определяемых общественным бытием.", "q": "Общественное сознание - это духовная жизнь общества, оно является отражением жизни общества.", "p": 90}, {"t": "Классовая борьба", "g": 5, "d": "По Марксу - движущая сила истории: борьба социальных групп из-за собственности."}, {"t": "Отчуждение", "g": 5, "d": "Превращение продуктов и сил человека в чуждую ему силу, господствующую над ним."}, {"t": "Западничество", "g": 6, "d": "Течение русской мысли XIX в., видевшее будущее России в европейском пути (Чаадаев, Герцен)."}, {"t": "Славянофильство", "g": 6, "d": "Течение русской мысли XIX в., утверждавшее самобытность России и православных основ (Хомяков, Киреевский)."}, {"t": "Соборность", "g": 6, "d": "Единство людей в любви и свободе на основе православной веры (Хомяков)."}, {"t": "Всеединство", "g": 6, "d": "Идея В. Соловьёва: целостность мира, в котором всё связано и стремится к единству в Боге."}, {"t": "Богочеловечество", "g": 6, "d": "У Соловьёва - идея соединения божественного и человеческого начал в истории."}, {"t": "Русская философия", "g": 6, "d": "Национальная философская традиция, центрированная на нравственности, цельности человека, общественном идеале."}, {"t": "Серебряный век", "g": 6, "d": "Период расцвета русской религиозной философии на рубеже XIX-XX вв."}, {"t": "Правосознание", "g": 6, "d": "Духовная способность человека к пониманию права; у Ильина - основа правового строя."}, {"t": "Философия жизни", "g": 7, "d": "Течение, ставящее в центр жизнь как иррациональное творческое начало (Шопенгауэр, Ницше, Бергсон)."}, {"t": "Воля к власти", "g": 7, "d": "У Ницше - основа жизни: стремление к росту, господству и самопреодолению."}, {"t": "Сверхчеловек", "g": 7, "d": "У Ницше - идеал человека, создающего собственные ценности."}, {"t": "Нигилизм", "g": 7, "d": "Отрицание всех общепризнанных ценностей и идеалов."}, {"t": "Иррационализм", "g": 7, "d": "Направление, считающее главным в мире нечто неразумное - волю, жизнь, интуицию."}, {"t": "Экзистенциализм", "g": 7, "d": "Философия существования: человек сам творит себя через свободный выбор и ответственность."}, {"t": "Экзистенция", "g": 7, "d": "Подлинное индивидуальное существование человека, не сводимое к его свойствам и роли."}, {"t": "Страх", "g": 7, "d": "В экзистенциализме - переживание, раскрывающее человеку его конечность и свободу."}, {"t": "Отчаяние", "g": 7, "d": "У Кьеркегора - состояние осознания разрыва с собой и Богом, путь к подлинной вере."}, {"t": "Подлинность", "g": 7, "d": "Жизнь человека в согласии с собой, а не по навязанным обществом шаблонам."}, {"t": "Осевое время", "g": 7, "d": "У Ясперса - период VIII-II вв. до н. э., когда возникли главные мировые духовные традиции."}, {"t": "Трансценденция", "g": 7, "d": "Выход за пределы наличного бытия; у Ясперса - предельное основание бытия."}, {"t": "Коммуникация", "g": 7, "d": "У Ясперса - универсальное свойство человеческого бытия: общение, раскрывающее подлинное «Я»."}, {"t": "Структурализм", "g": 7, "d": "Течение, изучающее культуру и общество как системы структур и знаков."}, {"t": "Постмодернизм", "g": 7, "d": "Культурная и философская позиция конца XX в., отвергающая единую истину и «большие нарративы»."}, {"t": "Психоанализ", "g": 7, "d": "Учение Фрейда о бессознательном и его роли в поведении и культуре."}, {"t": "Бессознательное", "g": 7, "d": "Сфера психики, не осознаваемая человеком, но влияющая на его поступки."}, {"t": "Бытие", "g": 8, "d": "Предельно общая категория: всё, что существует, - реальность в самом широком смысле."}, {"t": "Небытие", "g": 8, "d": "Отсутствие бытия; у Парменида - то, чего «нет и не может быть»."}, {"t": "Сущее", "g": 8, "d": "Конкретная вещь или явление, существующее; в отличие от бытия как такового (Хайдеггер)."}, {"t": "Становление", "g": 8, "d": "Переход от небытия к бытию, непрерывное возникновение и изменение вещей."}, {"t": "Материя", "g": 8, "d": "Объективная реальность, существующая независимо от сознания и данная в ощущениях."}, {"t": "Дух", "g": 8, "d": "Идеальное начало бытия: мышление, сознание, нравственная и творческая сила."}, {"t": "Идея", "g": 8, "d": "Мысленный образ, понятие; у Платона - вечная сущность вещей."}, {"t": "Идеальное и реальное бытие", "g": 8, "d": "Два способа бытия: мыслимые образы и смыслы - и вещи, существующие во внешнем мире."}, {"t": "Категория бытия", "g": 8, "d": "Предельное понятие, выражающее один из смыслов бытия (у Аристотеля - сущность, качество, количество и др.)."}, {"t": "Модус", "g": 8, "d": "Конкретный способ или состояние существования субстанции."}, {"t": "Форма", "g": 8, "d": "Внутренняя организация, структура вещи; у Аристотеля - её сущность."}, {"t": "Сущность", "g": 8, "d": "Внутреннее, устойчивое содержание вещи, определяющее её природу."}, {"t": "Существование", "g": 8, "d": "Факт наличия вещи, конкретный способ её бытия в мире."}, {"t": "Явление", "g": 8, "d": "Внешнее проявление сущности, данное нам в восприятии."}, {"t": "Действительность", "g": 8, "d": "Реально существ ятиях и суждениях."}, {"t": "Сознание", "g": 9, "d": "Способность осознавать мир и себя; высшая форма отражения действительности человеком."}, {"t": "Рефлексия", "g": 9, "d": "Обращение мышления на самого себя, самонаблюдение и анализ собственных состояний."}, {"t": "Понятие", "g": 9, "d": "Форма мысли, фиксирующая общие существенные признаки предметов."}, {"t": "Суждение", "g": 9, "d": "Форма мысли, в которой что-либо утверждается или отрицается."}, {"t": "Умозаключение", "g": 9, "d": "Форма мысли, в которой из одних суждений логически выводится новое."}, {"t": "Абстрагирование", "g": 9, "d": "Мысленное выделение существенных признаков предмета с отвлечением от несущественных."}, {"t": "Обобщение", "g": 9, "d": "Мысленное объединение предметов по общим признакам."}, {"t": "Анализ", "g": 9, "d": "Мысленное расчленение целого на части."}, {"t": "Синтез", "g": 9, "d": "Мысленное соединение частей в целое."}, {"t": "Тавтология", "g": 9, "d": "Определение или суждение, повторяющее одно и то же другими словами и ничего не объясняющее."}, {"t": "Подлинное мышление", "g": 9, "d": "Самостоятельное творческое мышление, в отличие от повторения готовых схем."}, {"t": "Познание", "g": 9, "d": "Процесс получения, осмысления и проверки знаний о мире и человеке."}, {"t": "Знание", "g": 9, "d": "Проверенный практикой результат познания, адекватно отражающий действительность."}, {"t": "Вера", "g": 9, "d": "Принятие чего-либо за истину без полного логического или опытного доказательства."}, {"t": "Убеждение", "g": 9, "d": "Устойчивое, обоснованное и эмоционально принятое представление, определяющее поведение."}, {"t": "Обоснование", "g": 9, "d": "Приведение доводов, подтверждающих истинность утверждения."}, {"t": "Истина", "g": 9, "d": "Соответствие знания действительности; адекватное отражение предмета в мышлении.", "q": "Истина - цель любой познавательной деятельности, это верно как для науки, так и для повседневной жизни.", "p": 183}, {"t": "Объект", "g": 9, "d": "То, на что напра let deck=[],total=0,known=0,rev=0;const $=i=>document.getElementById(i),fsel=$('fsel');G.forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=i?n:'Все разделы';fsel.append(o)});
function fshow(){$('finner').classList.remove('f');$('fcn').textContent='Осталось '+deck.length+' из '+total+' · выучено '+known;setTimeout(()=>{if(!deck.length){$('ffront').innerHTML='<h3>Готово!</h3><p>Выучено карточек: '+known+'</p><small>Нажмите «Ещё раз», чтобы начать заново</small>';$('fback').innerHTML='';return}const e=deck[0],t='<h3>'+esc(e.t)+'</h3><small>'+G[e.g]+'</small>',d='<p>'+esc(e.d)+'</p>'+(e.q?'<span class="qq">«'+esc(e.q)+'»</span>':'');$('ffront').innerHTML=rev?d:t;$('fback').innerHTML=rev?t:d},230)}
function fstart(){deck=DATA.filter(e=>!+fsel.value||e.g==+fsel.value).sort(()=>Math.random()-.5);total=deck.length;known=0;fshow()}
$('fscene').onclick=()=>{if(deck.length)$('finner').classList.toggle('f')};
$('fknow').onclick=()=>{if(!deck.length)return;deck.shift();known++;fshow()};
$('fagain').onclick=()=>{if(!deck.length){fstart();return}deck.push(deck.shift());fshow()};
$('fmode').onclick=()=>{rev=1-rev;$('fmode').textContent=rev?'Смысл → термин':'Термин → смысл';fshow()};
fsel.onchange=fstart;
$('fopen').onclick=()=>{$('fc').hidden=false;document.body.style.overflow='hidden';fstart()};
$('fcx').onclick=()=>{$('fc').hidden=true;document.body.style.overflow=''};
render();
</script></body></html>
